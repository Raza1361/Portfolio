<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Recipe Finder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🍴 Recipe Finder</h1>
    <div class="search-box">
      <input type="text" id="search" placeholder="Enter ingredient or recipe name...">
      <button id="btn">Search</button>
    </div>
  </header>

  <div class="container">
    <div class="recipes" id="recipes"></div>
    <div class="no-results" id="noResults" style="display:none;">No recipes found. Try again!</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
